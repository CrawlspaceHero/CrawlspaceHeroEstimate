<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Crawlspace Hero — Proposal Generator</title>
<style>
  :root{
    --ink:#111111;
    --black:#0B0B0C;
    --yellow:#FFC629;
    --yellow-deep:#A67C00;
    --paper:#FFFFFF;
    --bg:#F5F5F2;
    --line:#E2E2DA;
    --muted:#6B6B66;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-text-size-adjust:100%;
  }
  button, .opt-item-head label, .tier-head label, input, textarea, a{
    touch-action:manipulation;
  }
  .panel, .preview-wrap{
    -webkit-overflow-scrolling:touch;
  }
  .scroll-hint{display:none;}
  .app{
    display:grid;
    grid-template-columns: 400px 1fr;
    gap:0;
    min-height:100vh;
    min-height:100dvh;
  }
  .panel{
    background:var(--paper);
    border-right:1px solid var(--line);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .panel-topbar{
    background:var(--black);
    padding:18px 24px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-badge{
    width:36px;height:36px;border-radius:50%;
    background:var(--yellow);
    display:flex;align-items:center;justify-content:center;
    color:var(--black);font-weight:800;font-size:15px;
    flex-shrink:0;
  }
  .panel-topbar h1{
    font-size:15px;margin:0;letter-spacing:.03em;
    color:#fff;
  }
  .panel-topbar .tagline{
    font-size:10.5px;color:var(--yellow);font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;
    margin:2px 0 0;
  }
  .panel-body{padding:22px 24px;flex:1;}
  fieldset{
    border:none;
    padding:0;
    margin:0 0 22px 0;
  }
  legend{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--yellow-deep);
    font-weight:800;
    margin-bottom:10px;
    padding:0;
  }
  label.field{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:12px;
  }
  label.field span{
    display:block;
    margin-bottom:4px;
    color:var(--ink);
    font-weight:600;
  }
  input[type=text], input[type=number], input[type=date], input[type=email], textarea{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:16px;
    color:var(--ink);
    background:#FBFBFA;
    font-family:inherit;
  }
  textarea{resize:vertical;line-height:1.4;}
  input:focus, textarea:focus{outline:2px solid var(--black); outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tier-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
  }
  .tier-block.active{border-color:var(--yellow); background:#FFFBEF;}
  .tier-head{
    display:flex;align-items:center;justify-content:between;
    gap:8px;margin-bottom:8px;
  }
  .tier-head label{
    display:flex;align-items:center;gap:8px;
    font-size:13.5px;font-weight:700;color:var(--ink);
    cursor:pointer;flex:1;
  }
  .tier-head input[type=checkbox]{accent-color:var(--black);width:16px;height:16px;}
  .tier-rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .tier-rate input{width:80px;padding:5px 7px;font-size:16px;}
  .tier-block textarea{font-size:16px;min-height:54px;}
  .opt-item{
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .opt-item:last-child{border-bottom:none;}
  .desc-toggle{margin-top:4px;}
  .desc-toggle summary{
    font-size:11px;color:var(--muted);cursor:pointer;
    user-select:none;font-weight:600;list-style:none;
  }
  .desc-toggle summary::-webkit-details-marker{display:none;}
  .desc-toggle summary::before{content:'▸ ';font-size:9px;}
  .desc-toggle[open] summary::before{content:'▾ ';}
  .desc-toggle summary:hover{color:var(--ink);}
  .desc-toggle textarea{margin-top:6px;}
  .opt-item-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;
  }
  .opt-item-head label{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--ink);font-weight:600;
    flex:1;cursor:pointer;
  }
  .opt-item input[type=checkbox]{
    width:16px;height:16px;accent-color:var(--black);
    flex-shrink:0;
  }
  .opt-item .price-input{width:88px;text-align:right;flex-shrink:0;}
  .opt-item textarea{font-size:16px;min-height:50px;}
  .addon-label{
    display:block;font-size:11px;color:var(--muted);
    margin:2px 0 4px 24px;cursor:pointer;
  }
  .addon-label input[type=checkbox]{
    width:13px;height:13px;vertical-align:-1px;margin-right:4px;
  }
  .btns{
    position:sticky;bottom:0;
    background:var(--paper);
    padding:14px 24px 20px;
    border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px;
  }
  .jump-to-preview{display:none;}
  .link-box{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;
    background:var(--black);padding:16px 20px;
    box-shadow:0 -4px 20px rgba(0,0,0,.25);
  }
  .link-box-inner{max-width:700px;margin:0 auto;}
  .link-box-label{color:var(--yellow);font-size:12px;font-weight:800;margin-bottom:8px;}
  .link-box input{
    width:100%;padding:10px;border-radius:6px;border:1px solid #444;
    font-size:13px;background:#fff;color:#111;margin-bottom:8px;
  }
  .link-box-btns{display:flex;gap:8px;}
  .link-box-btns button{
    flex:1;padding:10px;border:none;border-radius:6px;font-weight:800;font-size:13px;cursor:pointer;
  }
  #linkBoxCopyBtn{background:var(--yellow);color:var(--black);}
  #linkBoxCloseBtn{background:#333;color:#fff;}
  button{
    border:none;border-radius:7px;
    padding:11px 14px;
    font-size:13.5px;font-weight:800;
    cursor:pointer;
    letter-spacing:.01em;
  }
  .btn-primary{background:var(--black);color:var(--yellow);}
  .btn-primary:hover{background:#000;}
  .btn-secondary{background:#F1F1EC;color:var(--ink);border:1px solid var(--line);}
  .btn-secondary:hover{background:#E7E7DF;}

  /* preview side */
  .preview-wrap{
    padding:32px;
    overflow-y:auto;
    display:flex;
    justify-content:center;
  }
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:800px;
    padding:48px 56px;
    box-shadow:0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    min-height:1000px;
  }
  .doc-brand{font-size:22px;font-weight:800;color:var(--ink);margin:0;}
  .doc-tag{font-size:11.5px;color:var(--yellow-deep);font-weight:700;margin:2px 0 10px;letter-spacing:.03em;}
  .doc-logo{max-width:340px;height:auto;display:block;margin-bottom:14px;}
  .doc-contact{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
  .doc-title{
    font-size:22px;font-weight:800;color:var(--ink);
    border-bottom:4px solid var(--yellow);
    padding-bottom:8px;margin:18px 0 4px;
  }
  .doc-sent{font-size:11.5px;color:var(--muted);margin-bottom:18px;}
  .doc-recipient{font-size:12.5px;line-height:1.8;margin-bottom:16px;}
  .doc-recipient b{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--yellow-deep);text-transform:uppercase;margin-bottom:2px;}
  .doc-intro{font-size:12.5px;line-height:1.6;color:#333;margin-bottom:18px;}
  table.doc-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px;}
  table.doc-table thead th{
    background:var(--black);color:var(--yellow);text-align:left;
    padding:7px 8px;font-weight:700;
  }
  table.doc-table td{
    padding:8px;vertical-align:top;
    border-bottom:1px solid #ECECE6;
  }
  table.doc-table tr.selected-row td{background:#FFF7DD;}
  table.doc-table tr:nth-child(even):not(.selected-row) td{background:#FAFAF7;}
  .num{text-align:right;white-space:nowrap;}
  .qty{text-align:center;white-space:nowrap;}
  .tier-tag{display:inline-block;font-size:9.5px;font-weight:800;background:var(--yellow);color:var(--black);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;}
  .doc-note{font-size:10px;font-style:italic;color:var(--muted);margin:6px 0 14px;}
  .doc-total{font-size:14px;font-weight:800;color:var(--ink);margin:4px 0;}
  .totals-box{
    border:1px solid var(--line);border-left:5px solid var(--yellow);
    border-radius:6px;margin:14px 0 18px;overflow:hidden;
  }
  .totals-head{
    background:#FAFAF7;border-bottom:1px solid var(--line);
    padding:7px 14px;font-size:9.5px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-deep);
  }
  .total-row{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;padding:11px 14px;
  }
  .total-row + .total-row{border-top:1px dashed var(--line);}
  .total-label{font-size:12.5px;font-weight:600;color:#333;}
  .total-label .opt-mil{font-weight:800;color:var(--ink);}
  .total-value{font-size:19px;font-weight:800;color:var(--ink);white-space:nowrap;}
  .total-single .total-value{font-size:21px;}
  .doc-section h2{
    font-size:14px;color:var(--ink);
    border-left:4px solid var(--yellow);
    padding-left:8px;margin:22px 0 8px;
  }
  .doc-section p, .doc-section li{font-size:12px;line-height:1.6;color:#333;}
  .doc-section ol{padding-left:18px;margin:0;}
  .doc-section li{margin-bottom:8px;}
  .sig-block{margin-top:26px;font-size:12px;line-height:2;}
  .fill-line{border-bottom:1px solid #999;display:inline-block;min-width:220px;}
  .empty-hint{color:#AAAAA0;}
  .hero-badge{
    width:52px;height:52px;border-radius:50%;background:var(--black);
    display:flex;align-items:center;justify-content:center;
    color:var(--yellow);font-weight:800;font-size:20px;
    float:right;margin-top:-4px;
  }
@media (max-width: 900px){
    .app{
      grid-template-columns:1fr;
      min-height:0;
    }
    .panel{
      overflow-y:visible;
      max-height:none;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    .panel-body{padding:16px 16px 4px;}
    .preview-wrap{
      overflow-x:auto;
      overflow-y:visible;
      padding:16px;
      flex-direction:column;
      align-items:flex-start;
      -webkit-overflow-scrolling:touch;
    }
    .sheet{
      min-width:650px;
      padding:32px 28px;
      min-height:0;
    }
    .btns{padding:12px 16px 16px;}
    .btns button{padding:14px;font-size:15px;}
    .opt-item-head label, .tier-head label{padding:6px 0;}
    .opt-item input[type=checkbox], .tier-head input[type=checkbox]{
      width:20px;height:20px;
    }
    .addon-label input[type=checkbox]{width:16px;height:16px;}
    .price-input{width:76px !important;}
    .scroll-hint{
      display:block;text-align:center;font-size:12px;color:var(--muted);
      font-weight:700;padding:2px 0 10px;align-self:stretch;
    }
    .jump-to-preview{
      display:block;text-align:center;text-decoration:none;
      background:#FFFBEF;border:1.5px dashed var(--yellow-deep);
      color:var(--yellow-deep);font-weight:800;font-size:13px;
      padding:11px;border-radius:8px;
    }
  }

  @media print{
    .panel{display:none;}
    .app{display:block;}
    .preview-wrap{padding:0;}
    .sheet{box-shadow:none;max-width:100%;}
  }
</style>
</head>

<noscript>
  <div style="max-width:600px;margin:40px auto;padding:20px 24px;background:#FFF7DD;border:2px solid #A67C00;border-radius:10px;font-family:Arial,sans-serif;color:#111;">
    <b>This page needs JavaScript to work, and it looks like it's not running.</b>
    <p>If you're viewing this in a quick preview (like tapping a file in the iOS Files app), that preview doesn't run JavaScript. On iPhone: tap the <b>Share</b> icon and choose <b>"Open in Safari"</b> (or open Safari directly and use its file/download browser) to load this properly.</p>
  </div>
</noscript>
<div class="app">
  <div class="panel" id="panel">
    <div class="panel-topbar">
      <div class="brand-badge">CH</div>
      <div>
        <h1>Proposal Generator</h1>
        <div class="tagline">Crawlspace Hero</div>
      </div>
    </div>
    <div class="panel-body">

    <fieldset>
      <legend>Client &amp; Job Info</legend>
      <label class="field"><span>Client name</span><input type="text" id="clientName" placeholder="Jane Doe"></label>
      <label class="field"><span>Property address</span><input type="text" id="propAddress" placeholder="123 Main St, Nashville, TN"></label>
      <div class="row2">
        <label class="field"><span>Phone</span><input type="text" id="clientPhone" placeholder="(615) 555-0100"></label>
        <label class="field"><span>Email</span><input type="email" id="clientEmail" placeholder="jane@email.com"></label>
      </div>
      <div class="row2">
        <label class="field"><span>Estimate #</span><input type="text" id="estNum" placeholder="941"></label>
        <label class="field"><span>Date sent</span><input type="date" id="sentDate"></label>
      </div>
      <label class="field"><span>Crawlspace sq. ft.</span><input type="number" id="sqft" value="1100" min="1"></label>
    </fieldset>


    <fieldset>
      <legend>Vapor Barrier / Encapsulation (select one)</legend>
      <div id="tierBlocks"></div>
    </fieldset>

    <fieldset>
      <legend>Optional Line Items</legend>
      <div id="optItems"></div>
    </fieldset>

    </div>
    <div class="btns">
      <a href="#sheet" class="jump-to-preview">↓ View Full Proposal Preview</a>
      <button class="btn-primary" onclick="downloadWord()">Download as Word Document</button>
      <button class="btn-secondary" onclick="generateCustomerLink()">Get Customer Link (Interactive)</button>
      <button class="btn-secondary" onclick="downloadCustomerQuote()">Download Interactive File</button>
      <button class="btn-secondary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="scroll-hint">↔ Scroll sideways to see the full proposal</div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

function onTierChange(el){
  tiers.forEach(t=>{
    const cb = document.getElementById('tierchk_'+t.id);
    document.getElementById('tierblock_'+t.id).classList.toggle('active', cb && cb.checked);
  });
  render();
}

function onOptChange(id){
  if(document.getElementById('chk_'+id).checked){
    document.getElementById('addon_'+id).checked = false;
  }
  render();
}

function onAddonChange(id){
  if(document.getElementById('addon_'+id).checked){
    document.getElementById('chk_'+id).checked = false;
  }
  render();
}

function initAdminTool(){
const tierPanel = document.getElementById('tierBlocks');
tiers.forEach((t,i)=>{
  const block = document.createElement('div');
  block.className = 'tier-block';
  block.id = 'tierblock_'+t.id;
  block.innerHTML = `
    <div class="tier-head">
      <label><input type="checkbox" id="tierchk_${t.id}" name="tierType" value="${t.id}" onchange="onTierChange(this)"> ${t.label}</label>
    </div>
    <div class="tier-rate">$/sqft <input type="number" id="rate_${t.id}" value="${t.rate}" step="0.01" onchange="render()"></div>
    <details class="desc-toggle">
      <summary>Description &amp; warranty</summary>
      <textarea id="desc_${t.id}" onchange="render()">${t.desc}</textarea>
      <div class="tier-rate" style="margin-top:6px;">Warranty note:</div>
      <textarea id="warr_${t.id}" onchange="render()" style="min-height:36px;">${t.warranty}</textarea>
    </details>
  `;
  tierPanel.appendChild(block);
});

function money(n){ return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(v, fallback){ return v && v.trim() ? v : `<span class="empty-hint">${fallback}</span>`; }

function buildData(){
  const sqft = parseFloat(document.getElementById('sqft').value)||0;

  let items = [];
  let selectedTiers = [];
  tiers.forEach(t=>{
    const cb = document.getElementById('tierchk_'+t.id);
    if(cb && cb.checked){
      const rate = parseFloat(document.getElementById('rate_'+t.id).value)||0;
      const desc = document.getElementById('desc_'+t.id).value;
      const warr = document.getElementById('warr_'+t.id).value;
      const tierTotal = sqft*rate;
      items.push({
        id:t.id, name:t.label,
        desc: desc + (warr ? ' ' + warr : ''),
        qty: sqft.toLocaleString(), unit: '$'+rate.toFixed(2)+'/sqft',
        total: tierTotal, selected:true, isTier:true
      });
      selectedTiers.push({ label:t.label, total:tierTotal });
    }
  });

  let optTotal = 0;
  let addons = [];
  optionalItems.forEach(o=>{
    const checked = document.getElementById('chk_'+o.id).checked;
    const isAddon = document.getElementById('addon_'+o.id).checked;
    if(checked || isAddon){
      const price = parseFloat(document.getElementById('price_'+o.id).value)||0;
      const desc = document.getElementById('descopt_'+o.id).value;
      const qty = o.qtyEditable ? (parseFloat(document.getElementById('qty_'+o.id).value)||0) : 1;
      const nameEl = document.getElementById('name_'+o.id);
      const itemName = o.custom ? (nameEl && nameEl.value.trim() ? nameEl.value.trim() : '') : o.name;
      if(o.custom && !itemName){ return; }
      const lineTotal = price*qty;
      const row = {
        name:itemName, desc:desc, qty: qty.toLocaleString(),
        unit: o.label==='FREE' ? 'FREE' : money(price),
        total: lineTotal, isFree: o.label==='FREE'
      };
      if(isAddon){ addons.push(row); }
      else { optTotal += lineTotal; items.push(row); }
    }
  });

  return {
    clientName: document.getElementById('clientName').value,
    propAddress: document.getElementById('propAddress').value,
    clientPhone: document.getElementById('clientPhone').value,
    estNum: document.getElementById('estNum').value,
    sentDate: document.getElementById('sentDate').value,
    sqft, items, addons, optTotal, selectedTiers
  };
}

function escTemplate(str){

function gatherQuoteData(){
  const sqft = parseFloat(document.getElementById('sqft').value)||0;
  const selectedTierIds = tiers
    .filter(t=>{ const cb=document.getElementById('tierchk_'+t.id); return cb && cb.checked; })
    .map(t=>t.id);

  const tierData = tiers.map(t=>{
    const rate = parseFloat(document.getElementById('rate_'+t.id).value)||0;
    const desc = document.getElementById('desc_'+t.id).value;
    const warranty = document.getElementById('warr_'+t.id).value;
    const entry = { id: t.id };
    if(rate !== t.rate){ entry.rate = rate; }
    if(desc !== t.desc){ entry.desc = desc; }
    if(warranty !== t.warranty){ entry.warranty = warranty; }
    if(selectedTierIds.indexOf(t.id) !== -1){ entry.selected = true; }
    return entry;
  }).filter(e => Object.keys(e).length > 1);

  const itemData = optionalItems.map(o=>{
    const price = parseFloat(document.getElementById('price_'+o.id).value)||0;
    const desc = document.getElementById('descopt_'+o.id).value;
    const checked = document.getElementById('chk_'+o.id).checked;
    const isAddon = document.getElementById('addon_'+o.id).checked;
    const qtyDefault = o.qtyEditable ? o.qtyDefault : 1;
    const qty = o.qtyEditable ? (parseFloat(document.getElementById('qty_'+o.id).value)||0) : 1;
    const entry = { id: o.id };
    if(o.custom){
      const nEl = document.getElementById('name_'+o.id);
      const nm = nEl && nEl.value.trim() ? nEl.value.trim() : '';
      if(!nm){ return entry; }
      entry.name = nm;
    }
    if(price !== o.price){ entry.price = price; }
    if(desc !== o.desc){ entry.desc = desc; }
    if(checked !== !!o.checked){ entry.checked = checked; }
    if(isAddon){ entry.addon = true; }
    if(qty !== qtyDefault){ entry.qty = qty; }
    return entry;
  }).filter(e => Object.keys(e).length > 1);

  return {
    sqft: sqft,
    selectedTierIds: selectedTierIds,
    tiers: tierData,
    items: itemData,
    clientName: document.getElementById('clientName').value,
    propAddress: document.getElementById('propAddress').value,
    clientPhone: document.getElementById('clientPhone').value,
    estNum: document.getElementById('estNum').value,
    sentDate: document.getElementById('sentDate').value
  };
}

  @media (max-width: 680px){

    .instructions{font-size:12.5px;padding:11px 12px;}
    table.doc-table, table.doc-table tbody{display:block;width:100%;}
    table.doc-table thead{display:none;}
    table.doc-table tr{
      display:flex;flex-direction:column;
      border:1px solid var(--line);border-radius:10px;
      padding:12px;margin-bottom:10px;background:#fff;
    }
    table.doc-table tr:nth-child(even){background:#fff;}
    table.doc-table tr.opt-row.excluded, table.doc-table tr.addon-row.excluded{background:#fafaf8;}
    table.doc-table td{
      display:block;width:100% !important;border:none !important;
      padding:3px 0 !important;background:transparent !important;
    }
    table.doc-table tr.opt-row.excluded td.num, table.doc-table tr.opt-row.excluded td.qty,

    table.doc-table td[data-label]::before{
      content: attr(data-label);
      display:inline-block;min-width:80px;font-size:9.5px;font-weight:800;
      color:var(--muted);text-transform:uppercase;letter-spacing:.04em;

  @media print{
    .sig-input{border-bottom:1px solid #999;}

  .print-btns{max-width:820px;margin:0 auto;padding:0 16px 40px;text-align:right;}
  .print-btns button{
    background:var(--black);color:var(--yellow);border:none;border-radius:8px;
    padding:12px 22px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .print-fallback{
    font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4;
    text-align:left;
  }
  @media print{ .print-btns{display:none;} body{background:#fff;} .sheet{box-shadow:none;} }
</style>
</head>
<body>
<noscript>
  <div style="max-width:600px;margin:40px auto;padding:20px 24px;background:#FFF7DD;border:2px solid #A67C00;border-radius:10px;font-family:Arial,sans-serif;color:#111;">
    <b>This page needs JavaScript to work, and it looks like it's not running.</b>
    <p>If you're viewing this in a quick preview (like tapping an email attachment or a file in the iOS Files app), that preview doesn't run JavaScript. On iPhone: tap the <b>Share</b> icon and choose <b>"Open in Safari"</b> to load it properly and make your selections.</p>
  </div>
</noscript>
<div class="wrap">
  <div class="sheet">
    <img src="${LOGO_DATA_URI}" alt="Crawlspace Hero" class="doc-logo">
    <p class="doc-contact">Crawlspace Hero 615-332-1043<br>710 Cleo Miller Dr, Suite 459, Nashville, TN 37206</p>

    <div class="doc-title">ESTIMATE ${escTemplate(estNum || '#____')}</div>
    <div class="doc-sent">SENT ON: ${sentDateDisplay}</div>

    <div class="doc-recipient">
      <b>Recipient</b>
      ${escTemplate(clientName || 'Client Name')}<br>
      ${escTemplate(propAddress || 'Property Address')}<br>
      ${escTemplate(clientPhone || 'Phone')}
    </div>

    <p class="doc-intro">In response to your request for a proposal, Crawlspace Hero ("CH") is pleased to submit the following estimate, based on a crawlspace of ${sqft.toLocaleString()} sq. ft. Pricing is subject to confirmation once a CH technician has inspected the site.</p>

    <div class="instructions">Use the Include / Remove toggle on each line to build your final scope. Your total updates automatically <b>right here on this page</b> — the print button at the bottom only saves a snapshot of your final picks, so make your selections first.</div>

    ${tierChoiceNote}

    <table class="doc-table">
      <thead><tr><th></th><th>Product/Service</th><th>Description</th><th>Qty.</th><th>Unit Price</th><th>Total</th></tr></thead>
      <tbody>${tierRowsHTML}${itemRowsHTML}</tbody>
    </table>

    <p class="doc-note">Total reflects every service currently marked "Include."</p>
    <p class="doc-total">Your Total: <span id="grandTotalDisplay">$0.00</span></p>

    ${addonSection}

    ${termsHTML}

    <div class="sig-block">
      <p class="doc-note" style="margin-bottom:10px;">You can type your information directly into the fields below, or print this page and fill them in by hand.</p>
      Respectfully,<br><b>Crawlspace Hero</b><br>615-332-1043<br><br>
      Date of Acceptance: <input type="text" class="sig-input sig-input-date" placeholder="MM/DD/YYYY"><br><br>
      Authorized Representative<br>
      Name: <input type="text" class="sig-input" placeholder="Full name"><br>
      Signature: <input type="text" class="sig-input" placeholder="Type full name to sign"><br>
      Title: <input type="text" class="sig-input" placeholder="e.g. Homeowner">
    </div>
  </div>
</div>
<div class="print-btns">
  <button onclick="window.print()">Done — Print / Save as PDF Copy</button>
  <div class="print-fallback">If this button doesn't respond, use your browser's Share icon (or menu) and choose Print instead — that always works.</div>
</div>
<script>
function money(n){ return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function setOptRow(tr, on){
  tr.dataset.selected = on ? 'true' : 'false';
  tr.classList.toggle('excluded', !on);
  const removeSeg = tr.querySelector('.seg-remove');
  const includeSeg = tr.querySelector('.seg-include');
  if(removeSeg){ removeSeg.classList.toggle('active', !on); }
  if(includeSeg){ includeSeg.classList.toggle('active', on); }
}
function optSegClick(e, seg, on){
  e.stopPropagation();
  const tr = seg.closest('tr');
  if(tr.classList.contains('tier-row')){
    if(!on){ return; }
    document.querySelectorAll('tr.tier-row').forEach(function(row){
      setOptRow(row, row === tr);
    });
  } else {
    setOptRow(tr, on);
  }
  recalc();
}
function rowClick(tr){
  if(tr.classList.contains('tier-row')){
    if(tr.dataset.selected === 'true'){ return; }
    document.querySelectorAll('tr.tier-row').forEach(function(row){
      setOptRow(row, row === tr);
    });
  } else {
    setOptRow(tr, tr.dataset.selected !== 'true');
  }
  recalc();
}
function recalc(){
  let total = 0;
  document.querySelectorAll('tr.opt-row, tr.tier-row').forEach(function(tr){
    if(tr.dataset.selected === 'true'){ total += parseFloat(tr.dataset.total); }
  });
  document.getElementById('grandTotalDisplay').textContent = money(total);

  let addonTotal = 0;
  document.querySelectorAll('tr.addon-row').forEach(function(tr){
    if(tr.dataset.selected === 'true'){ addonTotal += parseFloat(tr.dataset.total); }
  });
  const line = document.getElementById('addonTotalLine');
  if(line){
    if(addonTotal > 0){
      line.style.display = '';
      document.getElementById('addonTotalDisplay').textContent = money(total + addonTotal);
    } else {
      line.style.display = 'none';
    }
  }
}
document.addEventListener('DOMContentLoaded', recalc);
<\/script>
</body>
</html>
`;
  return docHtml;
}

function downloadCustomerQuote(){
  const data = gatherQuoteData();
  const docHtml = buildCustomerQuoteHtml(data);

  const blob = new Blob([docHtml], {type:'text/html'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const nameForFile = data.clientName || 'Client';
  link.download = `Crawlspace_Hero_Quote_${nameForFile.replace(/\s+/g,'_')}.html`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function generateCustomerLink(){
  const data = gatherQuoteData();
  const json = JSON.stringify(data);
  const encoded = b64EncodeUnicode(json);
  const url = location.origin + location.pathname + '?quote=' + encodeURIComponent(encoded);
  showLinkBox(url);
}

function showLinkBox(url){
  let box = document.getElementById('linkBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'linkBox';
    box.className = 'link-box';
    box.innerHTML = `
      <div class="link-box-inner">
        <div class="link-box-label">Customer link — copy and text/email it to them:</div>
        <input type="text" id="linkBoxInput" readonly>
        <div class="link-box-btns">
          <button type="button" id="linkBoxCopyBtn">Copy Link</button>
          <button type="button" id="linkBoxCloseBtn">Close</button>
        </div>
      </div>
    `;
    document.body.appendChild(box);
    document.getElementById('linkBoxCopyBtn').addEventListener('click', function(){
      const input = document.getElementById('linkBoxInput');
      input.select();
      input.setSelectionRange(0, 99999);
      const btn = this;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(input.value).then(function(){
          btn.textContent = 'Copied ✓';
          setTimeout(function(){ btn.textContent = 'Copy Link'; }, 1800);
        }).catch(function(){
          document.execCommand('copy');
          btn.textContent = 'Copied ✓';
          setTimeout(function(){ btn.textContent = 'Copy Link'; }, 1800);
        });
      } else {
        document.execCommand('copy');
        btn.textContent = 'Copied ✓';
        setTimeout(function(){ btn.textContent = 'Copy Link'; }, 1800);
      }
    });
    document.getElementById('linkBoxCloseBtn').addEventListener('click', function(){
      box.style.display = 'none';
    });
  }
  document.getElementById('linkBoxInput').value = url;
  box.style.display = 'flex';
}

function downloadWord(){
  const content = document.getElementById('sheet').innerHTML;
  const docHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
      body{font-family:Calibri,Arial,sans-serif;color:#111;}
      table{border-collapse:collapse;width:100%;font-size:11pt;}
      td,th{border:1px solid #ccc;padding:6px;text-align:left;vertical-align:top;}
      th{background:#0B0B0C;color:#FFC629;}
      tr.selected-row td{background:#FFF7DD;}
      h2{color:#111;font-size:13pt;border-left:4px solid #FFC629;padding-left:8px;}
      .doc-brand{font-size:20pt;font-weight:bold;}
      .doc-tag{color:#A67C00;font-weight:bold;}
      .doc-title{font-size:18pt;font-weight:bold;border-bottom:4px solid #FFC629;padding-bottom:6px;}
      .doc-total{font-size:13pt;font-weight:bold;}
      .totals-box{border:1px solid #ccc;border-left:5px solid #FFC629;margin:14px 0 18px;}
      .totals-head{background:#FAFAF7;padding:6px 10px;font-size:8pt;font-weight:bold;
        letter-spacing:1px;text-transform:uppercase;color:#A67C00;border-bottom:1px solid #ccc;}
      .total-row{padding:8px 10px;border-bottom:1px dashed #ddd;}
      .total-label{font-size:11pt;}
      .total-label .opt-mil{font-weight:bold;}
      .total-value{font-size:15pt;font-weight:bold;float:right;}
      .tier-tag{background:#FFC629;color:#0B0B0C;font-size:8pt;font-weight:bold;padding:1px 6px;border-radius:3px;}
      .hero-badge{display:none;}
      .num{text-align:right;} .qty{text-align:center;}
    </style></head><body>${content}</body></html>`;
  const blob = new Blob(['\ufeff', docHtml], {type:'application/msword'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const clientName = document.getElementById('clientName').value || 'Client';
  link.download = `Crawlspace_Hero_Estimate_${clientName.replace(/\s+/g,'_')}.doc`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// init defaults
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(m,p){ return String.fromCharCode('0x'+p); }));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}

const _urlParams = new URLSearchParams(location.search);
const _quoteParam = _urlParams.get('quote');
if(_quoteParam){
  window.addEventListener('load', function(){
    try {
      const _data = JSON.parse(b64DecodeUnicode(_quoteParam));
      const _docHtml = buildCustomerQuoteHtml(_data);
      document.open();
      document.write(_docHtml);
      document.close();
    } catch(e){
      document.body.innerHTML = '<div style="padding:60px 20px;font-family:Arial,sans-serif;text-align:center;color:#333;"><h2>This link appears to be broken or incomplete.</h2><p>Please ask Crawlspace Hero for a new link.</p></div>';
    }
  });
} else {
  initAdminTool();
}
</script>
